name: Deploy server to Cloud Run

on:
  push:
    branches: [main]
    paths-ignore:
      - 'android/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-cloud-run
  cancel-in-progress: false

env:
  PROJECT_ID: gen-lang-client-0912555946
  PROJECT_NUMBER: '558255772316'
  REGION: europe-west3
  SERVICE: petcare

jobs:
  deploy:
    # Enabled once scripts/setup-gcp.sh has been run and the repo variable GCP_DEPLOY_ENABLED=true is set.
    if: vars.GCP_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/${{ env.PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github/providers/petcare
          service_account: petcare-deployer@${{ env.PROJECT_ID }}.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and push image
        run: |
          APP_URL="https://${SERVICE}-${PROJECT_NUMBER}.${REGION}.run.app"
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/petcare/server:${GITHUB_SHA}"
          echo "APP_URL=$APP_URL" >> "$GITHUB_ENV"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker build --build-arg VITE_APP_URL="$APP_URL" -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Deploy
        run: |
          gcloud run deploy "$SERVICE" \
            --image "$IMAGE" \
            --region "$REGION" \
            --service-account "petcare-run@${PROJECT_ID}.iam.gserviceaccount.com" \
            --allow-unauthenticated \
            --memory 1Gi \
            --max-instances 3 \
            --set-env-vars "SYNC_STORE=firestore,APP_URL=${APP_URL},GOOGLE_CLOUD_PROJECT=${PROJECT_ID}" \
            --set-secrets "GEMINI_API_KEY=gemini-api-key:latest"

      - name: Smoke test
        run: |
          curl -fsS -o /dev/null -w "%{http_code}\n" "$APP_URL/"
