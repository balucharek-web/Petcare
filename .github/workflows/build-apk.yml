name: Buduj plik APK na Androida

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Budowanie APK
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz kod źródłowy (Checkout)
        uses: actions/checkout@v4

      - name: Konfiguracja Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Konfiguracja Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Instalacja zależności projektu
        run: npm install --legacy-peer-deps

      - name: Kompilacja aplikacji webowej (Vite)
        run: npm run build

      - name: Synchronizacja Capacitor Android
        run: npx cap sync android

      - name: Nadanie uprawnień wykonywalności dla Gradle
        run: chmod +x android/gradlew

      - name: Kompilacja pakietu APK (Debug)
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/*.apk app/build/outputs/apk/debug/PetCare.apk

      - name: Publikacja gotowego pliku APK do pobrania (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: PetCare-App-debug.apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Odczytaj odciski certyfikatu (SHA-1 / SHA-256)
        run: |
          echo "=== Informacje o certyfikacie debug.keystore ==="
          keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android || true

      - name: Publikacja APK do GitHub Releases
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v2.30.0
          name: "PetCare v2.30.0 - Naprawa logowania Google na Androidzie (Natywny AccountPicker, brak błędów przeglądarki i domeny)"
          body: |
            ### 🐾 PetCare v2.30.0 - Niezawodne logowanie Google na Androidzie

            - 🚀 **Natywny AccountPicker Androida:** Logowanie Google działa teraz w 100% natywnie w systemie Android – koniec z błędami `auth/unauthorized-domain` oraz otwieraniem przeglądarki Chrome z błędem akcji.
            - 🛡️ **Kryptograficzny podpis urządzenia:** Wybór konta jest potwierdzany kryptograficznie przez aplikację z pieczęcią czasową i unikalnym podpisem, uniemożliwiając podszywanie się pod cudze konta.
            - ⚡ **1 kliknięcie bez wpisywania haseł:** Użytkownik wybiera swoje konto Google bezpośrednio z systemowego menu telefonu i jest natychmiast bezpiecznie logowany.
          files: |
            android/app/build/outputs/apk/debug/PetCare.apk
            android/app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
