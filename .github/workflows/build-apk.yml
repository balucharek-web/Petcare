name: Buduj plik APK na Androida

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Budowanie APK
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz kod źródłowy (Checkout)
        uses: actions/checkout@v4

      - name: Konfiguracja Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Konfiguracja Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Instalacja zależności projektu
        run: npm install --legacy-peer-deps

      - name: Kompilacja aplikacji webowej (Vite)
        run: npm run build

      - name: Synchronizacja Capacitor Android
        run: npx cap sync android

      - name: Nadanie uprawnień wykonywalności dla Gradle
        run: chmod +x android/gradlew

      - name: Kompilacja pakietu APK (Debug)
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/*.apk app/build/outputs/apk/debug/PetCare.apk

      - name: Publikacja gotowego pliku APK do pobrania (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: PetCare-App-debug.apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Publikacja APK do GitHub Releases
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v2.18.1
          name: "PetCare v2.18.1 - Natywne okno wyboru konta z Androida i ochrona biometryczna"
          body: |
            ### 🐾 PetCare v2.18.1 - Natywny wybór konta Google Android
            
            - 📱 **Natywny arkusz wyboru konta Android:** Kliknięcie „Wybierz konto Google z telefonu” otwiera natywny arkusz wyboru konta w stylu Material Androida z awatarami i zapamiętanymi kontami.
            - 👆 **Weryfikacja biometryczna / blokadą ekranu:** Logowanie do konta zabezpieczone jest natywną weryfikacją tożsamości Androida (odcisk palca, rozpoznawanie twarzy lub kod blokady ekranu telefonu).
            - 🛡️ **Pełna izolacja danych:** Nikt obcy nie może uzyskać dostępu do Twojej książeczki zdrowia zwierząt.
            - 🔒 **Zakładka E-mail i hasło:** Pełna ochrona hasłem dla każdego adresu e-mail.
          files: |
            android/app/build/outputs/apk/debug/PetCare.apk
            android/app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
