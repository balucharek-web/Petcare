name: Buduj plik APK na Androida

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Budowanie APK
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz kod źródłowy (Checkout)
        uses: actions/checkout@v4

      - name: Konfiguracja Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Konfiguracja Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Instalacja zależności projektu
        run: npm install --legacy-peer-deps

      - name: Kompilacja aplikacji webowej (Vite)
        run: npm run build

      - name: Synchronizacja Capacitor Android
        run: npx cap sync android

      - name: Nadanie uprawnień wykonywalności dla Gradle
        run: chmod +x android/gradlew

      - name: Kompilacja pakietu APK (Debug)
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/*.apk app/build/outputs/apk/debug/PetCare.apk

      - name: Publikacja gotowego pliku APK do pobrania (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: PetCare-App-debug.apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Publikacja APK do GitHub Releases
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v2.17.1
          name: "PetCare v2.17.1 - Obsługa lokalizacji Android, @capacitor/geolocation i systemowy modal GPS"
          body: |
            ### 🐾 PetCare v2.17.1
            
            - 🧭 **Wsparcie dla natywnego GPS na Androidzie:** Zintegrowano `@capacitor/geolocation` oraz uprawnienia `ACCESS_FINE_LOCATION` i `ACCESS_COARSE_LOCATION` w AndroidManifest.
            - 📡 **Systemowe powiadomienie o wyłączonej lokalizacji:** Gdy GPS w telefonie jest wyłączony, aplikacja nie gaśnie bez słowa, lecz wyświetla dedykowane systemowe okno z instrukcją i natychmiastowym ponowieniem.
            - 🏥 **Natychmiast widoczne kostki klinik 24/7:** Przeprojektowano widok, eliminując zasłaniające nagłówki.
            - 📍 **Obsługa dowolnej wsi i miasta w Polsce:** Geokodowanie OpenStreetMap dla ponad 50 000 miejscowości.
            - 📱 **Gotowy plik APK do instalacji.**
          files: |
            android/app/build/outputs/apk/debug/PetCare.apk
            android/app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
