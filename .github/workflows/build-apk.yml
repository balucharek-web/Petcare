name: Buduj plik APK na Androida

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Budowanie APK
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz kod źródłowy (Checkout)
        uses: actions/checkout@v4

      - name: Konfiguracja Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Konfiguracja Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Instalacja zależności projektu
        run: npm install --legacy-peer-deps

      - name: Kompilacja aplikacji webowej (Vite)
        run: npm run build

      - name: Synchronizacja Capacitor Android
        run: npx cap sync android

      - name: Nadanie uprawnień wykonywalności dla Gradle
        run: chmod +x android/gradlew

      - name: Kompilacja pakietu APK (Debug)
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/*.apk app/build/outputs/apk/debug/PetCare.apk

      - name: Publikacja gotowego pliku APK do pobrania (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: PetCare-App-debug.apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Publikacja APK do GitHub Releases
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v2.17.6
          name: "PetCare v2.17.6 - Naprawa logowania z Dyskiem Google bez błędu invalid action i natychmiastowa synchronizacja"
          body: |
            ### 🐾 PetCare v2.17.6
            
            - ☁️ **Naprawa logowania przyciskiem "Połącz bezpośrednio z Dyskiem Google":** Wyeliminowano błąd Firebase Auth `The requested action is invalid` na domenie `firebaseapp.com`. Przycisk główny łączy się teraz bezpośrednio i bezawaryjnie z kontem Google oraz chmurą Cloud Sync w 1 kliknięcie, bez zawodnych wyskakujących okienek popup blokowanych w przeglądarce mobilnej i w aplikacji APK.
            - 👥 **Wybór konta Google:** Bezpośrednia lista zapamiętanych kont Google na urządzeniu (Arek Bałuch, Marianna Macion itd.) z możliwością natychmiastowego przełączania i ręcznego wpisania dowolnego adresu e-mail.
            - 🎯 **Precyzyjna nawigacja pod drzwi kliniki:** Pełna nazwa placówki i czysty adres w Google Maps (bez zbędnych dopisków w nawiasach).
            - 🏥 **Baza weterynarzy i przełącznik dyżurów:** Wszystkie gabinety w Mikołowie i okolicy z podziałem na dyżury 24h i przychodnie dzienne.
          files: |
            android/app/build/outputs/apk/debug/PetCare.apk
            android/app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
