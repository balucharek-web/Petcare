name: Buduj plik APK na Androida

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Budowanie APK
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz kod źródłowy (Checkout)
        uses: actions/checkout@v4

      - name: Konfiguracja Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Konfiguracja Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Instalacja zależności projektu
        run: npm install --legacy-peer-deps

      - name: Kompilacja aplikacji webowej (Vite)
        run: npm run build

      - name: Synchronizacja Capacitor Android
        run: npx cap sync android

      - name: Nadanie uprawnień wykonywalności dla Gradle
        run: chmod +x android/gradlew

      - name: Generowanie oficjalnego klucza produkcyjnego (Release Keystore)
        run: |
          cd android/app
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias petcare \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass petcare123 \
            -keypass petcare123 \
            -dname "CN=PetCare Mobile, OU=Health, O=PetCare Systems, L=Warszawa, ST=Mazowieckie, C=PL"

      - name: Kompilacja pakietów APK (Release & Debug) oraz AAB (Google Play Bundle)
        run: |
          cd android
          ./gradlew assembleRelease assembleDebug bundleRelease --no-daemon
          mkdir -p ../dist-packages
          cp app/build/outputs/apk/release/*.apk ../dist-packages/PetCare.apk || true
          cp app/build/outputs/apk/release/*.apk ../dist-packages/PetCare-release.apk || true
          cp app/build/outputs/apk/debug/*.apk ../dist-packages/PetCare-debug.apk || true
          cp app/build/outputs/bundle/release/*.aab ../dist-packages/PetCare.aab || true

      - name: Publikacja plików instalacyjnych jako Artifact w GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: PetCare-Packages
          path: dist-packages/*
          retention-days: 30

      - name: Odczytaj odciski certyfikatów (SHA-1 / SHA-256)
        run: |
          echo "=== Informacje o oficjalnym certyfikacie produkcyjnym release.keystore ==="
          keytool -list -v -keystore android/app/release.keystore -alias petcare -storepass petcare123 || true

      - name: Publikacja APK i AAB do GitHub Releases
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v2.36.0
          name: "PetCare v2.36.0 - Książeczka Zdrowia PDF, Kompresja Zdjęć, Asystent Baterii & Podpis Produkcyjny APK/AAB"
          body: |
            ### 🐾 PetCare v2.36.0 - Wielkie Wydanie z 4 Nowymi Funkcjami!

            1. 📄 **Eksport Książeczki Zdrowia do PDF / Druku A4:**
               - Oficjalna karta medyczna pupila z danymi identyfikacyjnymi, mikroczipem, numerem paszportu, historią szczepień z pieczęciami, aktualnymi lekami, badaniami diagnostycznymi i podpisem lekarza. Gotowa do druku przed wizytą lub wyjazdem.
            2. ⚡ **Kompresja i optymalizacja zdjęć w locie:**
               - Zdjęcia z aparatów 50-108 MP są automatycznie kompresowane do formatu WebP/JPEG na urządzeniu przed zapisem, oszczędzając do 95% pamięci i przyspieszając synchronizację z chmurą.
               - Dodano możliwość szybkiej zmiany zdjęcia profilowego pupila bezpośrednio z karty głównej.
            3. 🔋 **Asystent Niezawodnych Powiadomień i Baterii Androida:**
               - Dedykowany asystent zapobiegający uśmiercaniu powiadomień o lekach przez nakładki Xiaomi (MIUI/HyperOS Autostart), Samsung (OneUI) i Huawei.
            4. 🔑 **Podpisanie oficjalnym kluczem produkcyjnym (Release Keystore) & Pakiet Google Play (.AAB):**
               - Wydanie zawiera oficjalnie podpisany plik produkcyjny `PetCare.apk`, wersję `PetCare-debug.apk` oraz paczkę `PetCare.aab` gotową do wgrania do sklepu Google Play Console.
          files: |
            dist-packages/PetCare.apk
            dist-packages/PetCare-release.apk
            dist-packages/PetCare-debug.apk
            dist-packages/PetCare.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
