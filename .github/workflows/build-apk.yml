name: Buduj plik APK na Androida

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Budowanie APK
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz kod źródłowy (Checkout)
        uses: actions/checkout@v4

      - name: Konfiguracja Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Konfiguracja Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Instalacja zależności projektu
        run: npm install --legacy-peer-deps

      - name: Kompilacja aplikacji webowej (Vite)
        run: npm run build

      - name: Synchronizacja Capacitor Android
        run: npx cap sync android

      - name: Nadanie uprawnień wykonywalności dla Gradle
        run: chmod +x android/gradlew

      - name: Kompilacja pakietu APK (Debug)
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/*.apk app/build/outputs/apk/debug/PetCare.apk

      - name: Publikacja gotowego pliku APK do pobrania (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: PetCare-App-debug.apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Publikacja APK do GitHub Releases
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v2.17.4
          name: "PetCare v2.17.4 - Bezpośrednie wywoływanie natywnego okna Androida do włączenia lokalizacji (Google Play Services ResolvableApiException)"
          body: |
            ### 🐾 PetCare v2.17.4
            
            - 🧭 **Bezpośrednie wywołanie natywnego okna Androida do włączenia lokalizacji:** Naprawiono kolejność wywołań w aplikacji na telefonie. Wcześniej `@capacitor/geolocation` blokował wywołanie błędem przy wyłączonym GPS zanim wtyczka natywna zdążyła pokazać okno systemowe. Teraz `NativeLocation.promptEnableLocation()` jest wywoływany w pierwszej kolejności, bez zbędnych blokad, co natychmiastowo otwiera bezpośredni dialog systemowy Androida (Google Play Services `ResolvableApiException`) z prośbą o włączenie lokalizacji jednym kliknięciem ("Włącz lokalizację w urządzeniu" -> [OK]).
            - 🛡️ **Odporne sprawdzanie i żądanie uprawnień Androida:** Zabezpieczono metody sprawdzania uprawnień `checkPermissions` i `requestPermissions`, dzięki czemu natywne okno zezwolenia na lokalizację dla PetCare ("Zezwalaj aplikacji PetCare na dostęp do informacji o lokalizacji tego urządzenia") pojawia się prawidłowo.
            - ⚙️ **Bezpośrednie przyciski do Ustawień Androida:** Jeśli użytkownik trwale odrzuci uprawnienia lub wyłączy GPS, aplikacja wyświetla wygodne przyciski kierujące bezpośrednio do ustawień uprawnień aplikacji PetCare lub systemowych ustawień GPS w telefonie.
            - 🏥 **Wyświetlanie klinik z miast ościennych:** Pełne sortowanie według odległości wokół Mikołowa (Mikołów, Tychy, Brynów, Gliwice, Chorzów itd.) z szacowanym czasem dojazdu samochodem.
          files: |
            android/app/build/outputs/apk/debug/PetCare.apk
            android/app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
