name: Buduj plik APK na Androida

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Budowanie APK
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz kod źródłowy (Checkout)
        uses: actions/checkout@v4

      - name: Konfiguracja Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Konfiguracja Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Instalacja zależności projektu
        run: npm install --legacy-peer-deps

      - name: Kompilacja aplikacji webowej (Vite)
        run: npm run build

      - name: Synchronizacja Capacitor Android
        run: npx cap sync android

      - name: Nadanie uprawnień wykonywalności dla Gradle
        run: chmod +x android/gradlew

      - name: Kompilacja pakietu APK (Debug)
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/*.apk app/build/outputs/apk/debug/PetCare.apk

      - name: Publikacja gotowego pliku APK do pobrania (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: PetCare-App-debug.apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Odczytaj odciski certyfikatu (SHA-1 / SHA-256)
        run: |
          echo "=== Informacje o certyfikacie debug.keystore ==="
          keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android || true

      - name: Publikacja APK do GitHub Releases
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v2.22.0
          name: "PetCare v2.22.0 - 100% Natywny wybór konta Google Play Services (bez błędu 10)"
          body: |
            ### 🐾 PetCare v2.22.0 - Ostateczne rozwiązanie logowania Google
            
            - 🛡️ **Brak błędu kod 10 (brak SHA-1):** Przejście na `AccountPicker` z Google Play Services, który nie wymaga rejestracji SHA-1 w chmurze i nie zwraca błędu 10.
            - 👤 **Jedno natywne okno systemowe:** Użytkownik widzi tylko jedno systemowe okno z wyborem swoich kont Google w telefonie.
            - ⚡ **Natychmiastowe logowanie:** Po jednorazowym dotknięciu konta następuje bezpośrednie zalogowanie do aplikacji.
          files: |
            android/app/build/outputs/apk/debug/PetCare.apk
            android/app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
