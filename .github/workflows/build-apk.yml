name: Buduj plik APK na Androida

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Budowanie APK
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz kod źródłowy (Checkout)
        uses: actions/checkout@v4

      - name: Konfiguracja Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Konfiguracja Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Instalacja zależności projektu
        run: npm install --legacy-peer-deps

      - name: Kompilacja aplikacji webowej (Vite)
        run: npm run build

      - name: Synchronizacja Capacitor Android
        run: npx cap sync android

      - name: Nadanie uprawnień wykonywalności dla Gradle
        run: chmod +x android/gradlew

      - name: Konfiguracja stałego oficjalnego klucza produkcyjnego (Official Release Keystore)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          OFFICIAL_KEYSTORE_B64: ""
        run: |
          cd android/app
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Używanie oficjalnego klucza z GitHub Secrets (ANDROID_KEYSTORE_BASE64)..."
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          elif [ -s release.keystore ]; then
            echo "Używanie stałego, trwałego klucza release.keystore z repozytorium..."
          else
            echo "Przywracanie stałego oficjalnego klucza produkcyjnego z bezpiecznego fallbacku..."
            echo "$OFFICIAL_KEYSTORE_B64" | base64 -d > release.keystore
          fi
          if [ ! -s release.keystore ]; then
            echo "BŁĄD: release.keystore nie został utworzony!"
            exit 1
          fi
          echo "Klucz release.keystore zweryfikowany pomyślnie."

      - name: Kompilacja pakietów APK (Release & Debug) oraz AAB (Google Play Bundle)
        run: |
          cd android
          ./gradlew assembleRelease assembleDebug bundleRelease --no-daemon
          mkdir -p ../dist-packages
          find app/build/outputs/apk/release -type f -name "*.apk" -not -name "*unsigned*" -exec cp {} ../dist-packages/PetCare.apk \;
          find app/build/outputs/apk/release -type f -name "*.apk" -not -name "*unsigned*" -exec cp {} ../dist-packages/PetCare-release.apk \;
          find app/build/outputs/apk/debug -type f -name "*.apk" -exec cp {} ../dist-packages/PetCare-debug.apk \;
          find app/build/outputs/bundle/release -type f -name "*.aab" -exec cp {} ../dist-packages/PetCare.aab \;
          ls -lh ../dist-packages/

      - name: Publikacja plików instalacyjnych jako Artifact w GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: PetCare-Packages
          path: dist-packages/*
          retention-days: 30

      - name: Odczytaj odciski certyfikatów (SHA-1 / SHA-256)
        run: |
          echo "=== Informacje o oficjalnym certyfikacie produkcyjnym release.keystore ==="
          keytool -list -v -keystore android/app/release.keystore -alias petcare -storepass petcare123 || true

      - name: Publikacja APK i AAB do GitHub Releases
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v2.46.0' }}
          name: "PetCare v2.46.0 - Poprawka formularza edycji zwierzaka i stabilizacja logowania Google"
          body: |
            ### 🐾 PetCare v2.46.0 - Aktualizacja i poprawki

            1. ✏️ **Wygodny formularz edycji zwierzaka:**
               - Przycisk **„Zapisz zmiany”** jest teraz przyklejony pływającym paskiem powyżej dolnego menu nawigacji (`sticky`), więc nigdy się pod nim nie chowa.
               - Dodano dodatkowy przycisk szybkiego zapisu i anulowania w nagłówku formularza edycji.
               - Dodano duży margines bezpieczeństwa na dole ekranu.

            2. 🔐 **Optymalizacja logowania kontem Google:**
               - Zintegrowano obsługę Google Identity Services (GIS) z automatycznym fallbackiem.
               - Płynna autoryzacja i ochrona przed błędami autoryzacji domen w środowiskach chmurowych.
          files: |
            dist-packages/PetCare.apk
            dist-packages/PetCare-release.apk
            dist-packages/PetCare-debug.apk
            dist-packages/PetCare.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
