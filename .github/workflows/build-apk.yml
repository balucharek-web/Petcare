name: Buduj plik APK na Androida

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Budowanie APK
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz kod źródłowy (Checkout)
        uses: actions/checkout@v4

      - name: Konfiguracja Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Konfiguracja Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Instalacja zależności projektu
        run: npm install --legacy-peer-deps

      - name: Kompilacja aplikacji webowej (Vite)
        run: npm run build

      - name: Synchronizacja Capacitor Android
        run: npx cap sync android

      - name: Nadanie uprawnień wykonywalności dla Gradle
        run: chmod +x android/gradlew

      - name: Kompilacja pakietu APK (Debug)
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/*.apk app/build/outputs/apk/debug/PetCare.apk

      - name: Publikacja gotowego pliku APK do pobrania (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: PetCare-App-debug.apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Odczytaj odciski certyfikatu (SHA-1 / SHA-256)
        run: |
          echo "=== Informacje o certyfikacie debug.keystore ==="
          keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android || true

      - name: Publikacja APK do GitHub Releases
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v2.27.0
          name: "PetCare v2.27.0 - W 100% niezawodny, bezpośredni kod QR (Direct Offline Sync) i import plików"
          body: |
            ### 🐾 PetCare v2.27.0 - Bezpośrednia, bezbłędna synchronizacja Kodem QR
            
            - 🚀 **100% bezpośredni kod QR (Direct Offline QR):** Pakiet danych zwierzaków jest kompresowany algorytmem Deflate i zapisywany bezpośrednio wewnątrz kodu QR. Kliknięcie „Pokaż Kod QR” nie wykonuje żadnych zewnętrznych zapytań sieciowych – brak błędu `Failed to fetch`!
            - 📷 **Błyskawiczny skan aparatem:** Skaner na drugim telefonie natychmiast odczytuje i rozpakowuje dane bezpośrednio z obrazu kodu QR w ułamku sekundy.
            - 📂 **Wczytaj i Pobierz .JSON:** Dodano przycisk „Wczytaj .JSON” do natychmiastowego importowania kopii zapasowej.
          files: |
            android/app/build/outputs/apk/debug/PetCare.apk
            android/app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
