name: Buduj plik APK na Androida

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Budowanie APK
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz kod źródłowy (Checkout)
        uses: actions/checkout@v4

      - name: Konfiguracja Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Konfiguracja Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Instalacja zależności projektu
        run: npm install --legacy-peer-deps

      - name: Kompilacja aplikacji webowej (Vite)
        run: npm run build

      - name: Synchronizacja Capacitor Android
        run: npx cap sync android

      - name: Nadanie uprawnień wykonywalności dla Gradle
        run: chmod +x android/gradlew

      - name: Kompilacja pakietu APK (Debug)
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/*.apk app/build/outputs/apk/debug/PetCare.apk

      - name: Publikacja gotowego pliku APK do pobrania (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: PetCare-App-debug.apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Publikacja APK do GitHub Releases
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v2.17.3
          name: "PetCare v2.17.3 - Wyświetlanie miast ościennych (Tychy, Katowice, Gliwice) i obsługa GPS"
          body: |
            ### 🐾 PetCare v2.17.3
            
            - 🏥 **Wyświetlanie miast ościennych wokół Mikołowa:** Po wybraniu lub zlokalizowaniu Mikołowa aplikacja nie ogranicza się do jednego miasta, lecz wyświetla wszystkie dyżury 24/7 z aglomeracji śląskiej (Mikołów, Tychy, Katowice Brynów, Chorzów, Gliwice, Zabrze, Sosnowiec, Bytom, Rybnik) posortowane ściśle według odległości od użytkownika.
            - ⏱️ **Szacowany czas dojazdu samochodem:** Każda klinika pokazuje dokładny dystans w km oraz przewidywany czas dojazdu (np. `~8-12 min`, `~12-18 min`).
            - 📍 **Oznaczenie miast ościennych:** Etykiety `🚗 Miasto ościenne (Katowice/Tychy)` oraz `📍 Na miejscu (Mikołów)` ułatwiające natychmiastową decyzję w nocy.
            - 🧭 **Bezpośrednie systemowe zapytanie o lokalizację na telefonie:** W aplikacji APK system Android wywołuje natywny dialog uprawnień oraz automatyczne włączenie GPS przez Google Play Services.
            - 📱 **Plik APK gotowy do instalacji na Androidzie.**
          files: |
            android/app/build/outputs/apk/debug/PetCare.apk
            android/app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
