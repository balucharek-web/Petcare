name: Buduj plik APK na Androida

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Budowanie APK
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz kod źródłowy (Checkout)
        uses: actions/checkout@v4

      - name: Konfiguracja Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Konfiguracja Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Instalacja zależności projektu
        run: npm install --legacy-peer-deps

      - name: Kompilacja aplikacji webowej (Vite)
        run: npm run build

      - name: Synchronizacja Capacitor Android
        run: npx cap sync android

      - name: Nadanie uprawnień wykonywalności dla Gradle
        run: chmod +x android/gradlew

      - name: Konfiguracja stałego klucza produkcyjnego (Persistent Release Keystore)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          cd android/app
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Używanie oficjalnego klucza z GitHub Secrets (ANDROID_KEYSTORE_BASE64)..."
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          elif [ -f release.keystore ]; then
            echo "Używanie stałego, trwałego klucza release.keystore z repozytorium..."
          else
            echo "Generowanie stałego klucza produkcyjnego (fallback)..."
            keytool -genkeypair -v \
              -keystore release.keystore \
              -alias petcare \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass petcare123 \
              -keypass petcare123 \
              -dname "CN=PetCare Mobile, OU=Health, O=PetCare Systems, L=Warszawa, ST=Mazowieckie, C=PL"
          fi

      - name: Kompilacja pakietów APK (Release & Debug) oraz AAB (Google Play Bundle)
        run: |
          cd android
          ./gradlew assembleRelease assembleDebug bundleRelease --no-daemon
          mkdir -p ../dist-packages
          cp app/build/outputs/apk/release/*.apk ../dist-packages/PetCare.apk || true
          cp app/build/outputs/apk/release/*.apk ../dist-packages/PetCare-release.apk || true
          cp app/build/outputs/apk/debug/*.apk ../dist-packages/PetCare-debug.apk || true
          cp app/build/outputs/bundle/release/*.aab ../dist-packages/PetCare.aab || true

      - name: Publikacja plików instalacyjnych jako Artifact w GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: PetCare-Packages
          path: dist-packages/*
          retention-days: 30

      - name: Odczytaj odciski certyfikatów (SHA-1 / SHA-256)
        run: |
          echo "=== Informacje o oficjalnym certyfikacie produkcyjnym release.keystore ==="
          keytool -list -v -keystore android/app/release.keystore -alias petcare -storepass petcare123 || true

      - name: Publikacja APK i AAB do GitHub Releases
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v2.37.0' }}
          name: "PetCare v2.37.0 - Galeria Zdjęć Pupilów, Naprawa Pobierania z Dysku Google & Poprawka Widżetu"
          body: |
            ### 🐾 PetCare v2.37.0 - Nowe Wydanie!

            1. 📸 **Biblioteka Przykładowych Zdjęć Pupilów:**
               - Nowa galeria gotowych zdjęć dla psów, kotów, królików, fretek, ptaków i gryzoni.
               - Dostępna przy dodawaniu nowego zwierzaka oraz w profilu pupila.
            2. ☁️ **Poprawka Pobierania Kopii z Dysku Google:**
               - Naprawiono autoryzację tokenów Google Drive OAuth na webie i Androidzie.
               - Bezpieczne pobieranie kopii zapasowej zwierzaka natychmiast po zalogowaniu.
            3. 📱 **Poprawka Widżetu Ekranu Startowego Androida:**
               - Zastąpiono niekompatybilne widoki i formaty ikon w RemoteViews bezpiecznym drawablerem wektorowym.
            4. 🛡️ **Silnik Danych IndexedDB & Trwały Klucz Podpisu APK:**
               - Pojemność bazy danych na setki megabajtów (zdjęcia, badania, skany książeczki).
               - Spójne podpisywanie stałym kluczem produkcyjnym `release.keystore`.
          files: |
            dist-packages/PetCare.apk
            dist-packages/PetCare-release.apk
            dist-packages/PetCare-debug.apk
            dist-packages/PetCare.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
