name: Buduj plik APK na Androida

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Budowanie APK
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz kod źródłowy (Checkout)
        uses: actions/checkout@v4

      - name: Konfiguracja Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Konfiguracja Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Instalacja zależności projektu
        run: npm install --legacy-peer-deps

      - name: Kompilacja aplikacji webowej (Vite)
        run: npm run build

      - name: Synchronizacja Capacitor Android
        run: npx cap sync android

      - name: Nadanie uprawnień wykonywalności dla Gradle
        run: chmod +x android/gradlew

      - name: Kompilacja pakietu APK (Debug)
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/*.apk app/build/outputs/apk/debug/PetCare.apk

      - name: Publikacja gotowego pliku APK do pobrania (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: PetCare-App-debug.apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Publikacja APK do GitHub Releases
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v2.17.8
          name: "PetCare v2.17.8 - Nowe intuicyjne Centrum Powiadomień, lista alertów i oznaczanie jako odczytane"
          body: |
            ### 🐾 PetCare v2.17.8
            
            - 🔔 **Nowe, w pełni intuicyjne Centrum Powiadomień:** Kliknięcie w dzwonek na górnym pasku otwiera teraz listę Twoich powiadomień i alertów (a nie same techniczne przełączniki wibracji i dźwięku!).
            - 📋 **Przejrzysta lista alertów:** Każde powiadomienie wyświetla rodzaj zdarzenia (szczepienie, odrobaczenie, wizyta, lek), imię pupila, termin oraz stopień pilności.
            - ✅ **Oznaczanie jako odczytane i czyszczenie:** Przycisk „Oznacz jako odczytane” oraz „Wyczyść wszystkie” pozwala natychmiast wyczyścić badge (czerwoną cyfrę 1) na dzwonku!
            - 🚀 **Szybkie przejście do szczegółów:** Bezpośredni przycisk „Przejdź do szczegółów” przenosi od razu do odpowiedniej zakładki (np. szczepień lub wizyt).
            - ⚙️ **Dedykowana zakładka Ustawień:** Przełączniki dźwięków, wibracji, kategorii i powiadomień testowych są teraz wygodnie dostępne w zakładce „Ustawienia powiadomień”.
            - 🐾 **Nowa ikona aplikacji (3 łapki):** Piękne logo z trzema łapkami na pulpicie i ekranie powitalnym.
          files: |
            android/app/build/outputs/apk/debug/PetCare.apk
            android/app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
