name: Buduj plik APK na Androida

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Budowanie APK
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz kod źródłowy (Checkout)
        uses: actions/checkout@v4

      - name: Konfiguracja Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Konfiguracja Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Instalacja zależności projektu
        run: npm install --legacy-peer-deps

      - name: Kompilacja aplikacji webowej (Vite)
        run: npm run build

      - name: Synchronizacja Capacitor Android
        run: npx cap sync android

      - name: Nadanie uprawnień wykonywalności dla Gradle
        run: chmod +x android/gradlew

      - name: Kompilacja pakietu APK (Debug)
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/*.apk app/build/outputs/apk/debug/PetCare.apk

      - name: Publikacja gotowego pliku APK do pobrania (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: PetCare-App-debug.apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Odczytaj odciski certyfikatu (SHA-1 / SHA-256)
        run: |
          echo "=== Informacje o certyfikacie debug.keystore ==="
          keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android || true

      - name: Publikacja APK do GitHub Releases
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v2.25.0
          name: "PetCare v2.25.0 - Nowa nowoczesna ikona aplikacji i pełna synchronizacja kodem QR z załącznikami"
          body: |
            ### 🐾 PetCare v2.25.0 - Nowa ikona & Synchronizacja Kodem QR
            
            - 🎨 **Nowa nowoczesna ikona aplikacji:** Świeży, elegancki design ikony we wszystkich rozdzielczościach Androida (mdpi, hdpi, xhdpi, xxhdpi, xxxhdpi) nawiązujący do nowoczesnej opieki weterynaryjnej (sylwetki pupili, serce i akcent medyczny).
            - 📷 **Synchronizacja kodem QR (zamiast PIN):** Szybkie przenoszenie danych między telefonami za pomocą wbudowanego skanera aparatu.
            - 📦 **100% danych ze wszystkimi załącznikami:** Błyskawiczny transfer wszystkich pupili, zdjęć, skanów badań medycznych, wpisów ze szczepieniami, leków i historii.
          files: |
            android/app/build/outputs/apk/debug/PetCare.apk
            android/app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
