name: Buduj plik APK na Androida

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Budowanie APK
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz kod źródłowy (Checkout)
        uses: actions/checkout@v4

      - name: Konfiguracja Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Konfiguracja Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Instalacja zależności projektu
        run: npm install --legacy-peer-deps

      - name: Kompilacja aplikacji webowej (Vite)
        run: npm run build

      - name: Synchronizacja Capacitor Android
        run: npx cap sync android

      - name: Nadanie uprawnień wykonywalności dla Gradle
        run: chmod +x android/gradlew

      - name: Kompilacja pakietu APK (Debug)
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/*.apk app/build/outputs/apk/debug/PetCare.apk

      - name: Publikacja gotowego pliku APK do pobrania (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: PetCare-App-debug.apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Publikacja APK do GitHub Releases
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v2.16.0
          name: "PetCare v2.16.0 - Wszystkie miasta (dyżury 24h), GPS i przesuwanie kafelków"
          body: |
            ### 🐾 PetCare v2.16.0
            
            - 🏥 **Wyszukiwarka całodobowych klinik 24h dla wszystkich miast i 16 województw w Polsce** (baza ponad 120 miast, automatyczne wyznaczanie najbliższego ostrego dyżuru i dystansu w km).
            - 📍 **Ulepszona geolokalizacja:** szybki GPS, lokalizacja sieciowa (IP) oraz ręczny wybór własnego miasta.
            - 🧩 **Przeciąganie i własna kolejność kafelków na pulpicie (Drag & Drop)** dla myszy i ekranów dotykowych.
            - 📱 **Plik instalacyjny APK dla Androida.**
          files: |
            android/app/build/outputs/apk/debug/PetCare.apk
            android/app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
