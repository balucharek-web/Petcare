name: Buduj plik APK na Androida

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Budowanie APK
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz kod źródłowy (Checkout)
        uses: actions/checkout@v4

      - name: Konfiguracja Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Konfiguracja Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Instalacja zależności projektu
        run: npm ci --legacy-peer-deps

      - name: Sprawdzenie typów (tsc)
        run: npm run lint

      - name: Testy automatyczne (Vitest)
        run: npm test

      - name: Kompilacja aplikacji webowej (Vite)
        run: npm run build

      - name: Synchronizacja Capacitor Android
        run: npx cap sync android

      - name: Nadanie uprawnień wykonywalności dla Gradle
        run: chmod +x android/gradlew

      - name: Odczyt wersji aplikacji
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Przygotowanie klucza podpisującego z GitHub Secrets
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Brak sekretu ANDROID_KEYSTORE_BASE64 - budowany będzie tylko APK debug, bez publikacji wydania."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Kompilacja APK debug
        if: steps.keystore.outputs.signed != 'true'
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace
          mkdir -p ../dist-packages
          find app/build/outputs/apk/debug -type f -name "*.apk" -exec cp {} ../dist-packages/PetCare-debug.apk \;

      - name: Kompilacja pakietów APK (Release & Debug) oraz AAB (Google Play Bundle)
        if: steps.keystore.outputs.signed == 'true'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleRelease assembleDebug bundleRelease --no-daemon --stacktrace || (sleep 5 && ./gradlew assembleRelease assembleDebug bundleRelease --no-daemon --stacktrace)
          mkdir -p ../dist-packages
          find app/build/outputs/apk/release -type f -name "*.apk" -not -name "*unsigned*" -exec cp {} ../dist-packages/PetCare.apk \;
          find app/build/outputs/apk/release -type f -name "*.apk" -not -name "*unsigned*" -exec cp {} ../dist-packages/PetCare-release.apk \;
          find app/build/outputs/apk/debug -type f -name "*.apk" -exec cp {} ../dist-packages/PetCare-debug.apk \;
          find app/build/outputs/bundle/release -type f -name "*.aab" -exec cp {} ../dist-packages/PetCare.aab \;
          ls -lh ../dist-packages/

      - name: Publikacja plików instalacyjnych jako Artifact w GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: PetCare-Packages
          path: dist-packages/*
          retention-days: 30

      - name: Odczytaj odciski certyfikatów (SHA-1 / SHA-256)
        if: steps.keystore.outputs.signed == 'true'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: keytool -list -v -keystore "$ANDROID_KEYSTORE_PATH" -alias "${ANDROID_KEY_ALIAS:-petcare}" -storepass:env ANDROID_KEYSTORE_PASSWORD | grep -E "SHA1|SHA256" || true

      - name: Publikacja APK i AAB do GitHub Releases
        uses: softprops/action-gh-release@v2
        if: success() && steps.keystore.outputs.signed == 'true'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.version.outputs.version) }}
          name: PetCare v${{ steps.version.outputs.version }}
          make_latest: true
          generate_release_notes: true
          files: |
            dist-packages/PetCare.apk
            dist-packages/PetCare-release.apk
            dist-packages/PetCare-debug.apk
            dist-packages/PetCare.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
