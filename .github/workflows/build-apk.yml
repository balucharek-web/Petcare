name: Buduj plik APK na Androida

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Budowanie APK
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz kod źródłowy (Checkout)
        uses: actions/checkout@v4

      - name: Konfiguracja Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Konfiguracja Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Instalacja zależności projektu
        run: npm install --legacy-peer-deps

      - name: Kompilacja aplikacji webowej (Vite)
        run: npm run build

      - name: Synchronizacja Capacitor Android
        run: npx cap sync android

      - name: Nadanie uprawnień wykonywalności dla Gradle
        run: chmod +x android/gradlew

      - name: Kompilacja pakietu APK (Debug)
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/*.apk app/build/outputs/apk/debug/PetCare.apk

      - name: Publikacja gotowego pliku APK do pobrania (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: PetCare-App-debug.apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Publikacja APK do GitHub Releases
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v2.17.5
          name: "PetCare v2.17.5 - Dokładna nawigacja pod drzwi kliniki, wszyscy weterynarze w mieście i filtr dyżurów"
          body: |
            ### 🐾 PetCare v2.17.5
            
            - 🎯 **Precyzyjna nawigacja pod sam adres kliniki:** Naprawiono błąd generowania trasy GPS. Usunięto błędy w adresach i współrzędnych. Do Google Maps przekazywana jest teraz pełna nazwa placówki oraz czysty, precyzyjny adres (np. `Klinika Teodorowscy, ul. Żwirki i Wigury 5, 43-190 Mikołów`), dzięki czemu nawigacja prowadzi bezpośrednio pod drzwi lecznicy, a nie na losowe ulice czy drogi dojazdowe.
            - 🏥 **Baza wszystkich weterynarzy w danym mieście:** Dodano rzeczywiste gabinety i przychodnie w Mikołowie (Klinika Teodorowscy 24h, Gabinet Doktor Wojtek, Gabinet Sikorski, Gabinet Lewicka, Leśne Pogotowie) ze sprawdzonymi numerami telefonów i godzinami przyjęć.
            - 🔄 **Przełącznik "Wszyscy weterynarze" / "Tylko dyżur 24/7":** Możliwość szybkiego przełączania między całodobowymi dyżurami ratunkowymi a wszystkimi dziennymi gabinetami i lecznicami w okolicy.
            - 🗺️ **Wyszukiwarka wszystkich okolicznych weterynarzy:** Bezpośredni przycisk otwierający mapę wszystkich okolicznych lecznic weterynaryjnych na Google Maps w dowolnym mieście w Polsce.
          files: |
            android/app/build/outputs/apk/debug/PetCare.apk
            android/app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
