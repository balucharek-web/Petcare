name: Buduj plik APK na Androida

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Budowanie APK
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz kod źródłowy (Checkout)
        uses: actions/checkout@v4

      - name: Konfiguracja Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Konfiguracja Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Instalacja zależności projektu
        run: npm install --legacy-peer-deps

      - name: Kompilacja aplikacji webowej (Vite)
        run: npm run build

      - name: Synchronizacja Capacitor Android
        run: npx cap sync android

      - name: Nadanie uprawnień wykonywalności dla Gradle
        run: chmod +x android/gradlew

      - name: Kompilacja pakietu APK (Debug)
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/*.apk app/build/outputs/apk/debug/PetCare.apk

      - name: Publikacja gotowego pliku APK do pobrania (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: PetCare-App-debug.apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Publikacja APK do GitHub Releases
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v2.17.7
          name: "PetCare v2.17.7 - Nowa ikona aplikacji z 3 łapkami, naprawiona kropka powiadomień na dzwonku oraz nowe ekrany startowe splash"
          body: |
            ### 🐾 PetCare v2.17.7
            
            - 🐾 **Nowa ikona aplikacji (3 urocze łapki zwierzaka):** Nowy, nowoczesny motyw ikony aplikacji z trzema łapkami w pięknej szmaragdowo-morskiej i ciepłej złotej tonacji z miękkim cieniem 3D, zaktualizowany dla ikon PWA na pulpicie, ikon aplikacji na Androidzie (adaptive launcher icons) oraz ekranów powitalnych (splash screens).
            - 🔔 **Naprawa kropki na ikonce powiadomień (dzwonek):** Kropka / wskaźnik na dzwonku nie świeci się już bez przerwy! Pojawia się wyłącznie wtedy, gdy rzeczywiście masz aktywne przypomnienie lub zaległy wpis (szczepienie, lek, wizyta u weterynarza) z dokładną liczbą alertów. Gdy nie ma nowych alertów, ikona dzwonka jest czysta i nie wprowadza w błąd.
            - ☁️ **Stabilna synchronizacja z Dyskiem Google:** Bezawaryjne łączenie konta Google w 1 kliknięcie bez błędów popup.
            - 🎯 **Precyzyjna nawigacja pod drzwi kliniki:** Pełna nazwa placówki i czysty adres w Google Maps z podziałem na dyżury 24h i gabinety dzienne.
          files: |
            android/app/build/outputs/apk/debug/PetCare.apk
            android/app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
